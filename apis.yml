aid: ribbit-capital
name: Ribbit Capital
description: >-
  Ribbit Capital is a venture capital firm founded in 2012 by Micky Malka and headquartered in Palo Alto,
  California, investing globally in founders who challenge the status quo across financial services and
  adjacent frontier categories. Long the most focused fintech investor in venture, Ribbit backs companies
  reshaping money movement, wealth management, identity, data, and global commerce, and has broadened its
  thesis into crypto and blockchain infrastructure, AI, and energy. The firm invests from early stage
  through growth, historically concentrating on Series A and B rounds while following its winners over
  time, and reported roughly US$12 billion in regulatory assets under management as of 2024. Ribbit's
  portfolio of 150+ companies spans nearly every continent and includes many of fintech's defining
  outcomes such as Robinhood, Coinbase, Nubank, Credit Karma, Affirm, Revolut, Brex, Mercado Libre, and
  Groww, alongside newer bets in crypto (Solana, Ethena, Lightspark), AI (Cognition, Etched, Decagon),
  and energy (Base Power, Crusoe). In 2021 Ribbit partnered with Walmart to launch the consumer fintech
  venture now known as OnePay.
